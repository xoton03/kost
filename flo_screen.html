<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Flo - Mobile Price Search</title>
<link rel="stylesheet" href="tailwind-flo-screen.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0A0A0A;
            color: #FFFFFF;
        }
        .terminal-blink::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="font-body-main selection:bg-primary-container selection:text-white">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 bg-background border-b border-outline">
<div class="flex items-center gap-3">
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold tracking-widest text-primary uppercase">FLO_CMD</h1>
</div>
</header>
<!-- Main Content -->
<main class="pt-20 pb-24 px-4 flex flex-col gap-6"><section class="flex flex-col gap-2 mb-8">
<label class="font-label-caps text-label-caps text-primary uppercase ml-1">SEARCH_CMD</label>
<div class="border border-outline bg-surface p-4">
<input class="bg-transparent border-none focus:ring-0 p-0 text-body-main font-body-mono placeholder:opacity-30 uppercase w-full" placeholder="ENTER_PRODUCT_ID" type="text"/>
</div>
</section>
<section class="flex flex-col border border-outline bg-surface">
<div class="p-6 border-b border-outline">
<h2 class="font-headline-md text-headline-md text-white font-bold leading-tight uppercase tracking-tight">COFFRET_ELECTRIQUE_V3</h2>
<div class="flex items-center gap-2 mt-2">
<span class="font-body-mono text-label-caps text-on-surface-variant border border-outline px-2 py-0.5">INDUSTRIAL_GRADE</span>
<span class="font-body-mono text-label-caps text-primary border border-primary-container px-2 py-0.5">IN_STOCK</span>
</div>
</div>
<div class="p-6 border-b border-outline flex flex-col items-start gap-1">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">UNIT_PRICE_NET</span>
<div class="flex items-baseline gap-2">
<span class="font-display-lg text-6xl text-primary-container font-black tracking-tighter">1.500</span>
<span class="font-headline-md text-2xl text-primary-container font-bold">DA</span>
</div>
</div>
<div class="grid grid-cols-2 gap-px bg-outline">
<div class="bg-surface p-4 flex flex-col">
<span class="font-label-caps text-[10px] text-on-surface-variant uppercase mb-1">REFERENCE</span>
<span class="font-body-mono text-body-mono text-white">REF_99827-CX</span>
</div>
<div class="bg-surface p-4 flex flex-col">
<span class="font-label-caps text-[10px] text-on-surface-variant uppercase mb-1">GENCOD</span>
<span class="font-body-mono text-body-mono text-white">613000998271</span>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary-container py-6 font-label-caps text-label-caps font-black uppercase hover:bg-white hover:text-black transition-colors">
    ADD_TO_MANIFEST
  </button>
</section></main>
<!-- BottomNavBar -->
</body></html>
