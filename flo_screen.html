        }
        body {
            background-color: #0A0A0A;
            color: #FFFFFF;
        }
        .terminal-blink::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>

    body {

</div>

<span class="font-body-mono text-body-mono text-white">613000998271</span>
</div>
</div>
