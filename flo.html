<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.O.S.T. - Flo Stock</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <link rel="manifest" href="manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="lucide.js" defer></script>
    <script src="dexie.js" defer></script>
    <script src="database.js" defer></script>
    <script src="sync.js" defer></script>
    <script src="flo.js" defer></script>
    <script src="navigation.js" defer></script>
    <link rel="stylesheet" href="styles.css">

    <style>
        /* Mobile-first card grid */
        @media (max-width: 768px) {
            .results-table {
                display: none;
            }

            .results-grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: 1rem;
                padding: 1rem;
            }

            .scan-btn {
                display: flex !important;
            }
        }

        @media (min-width: 769px) {
            .results-grid {
                display: none;
            }

            .scan-btn {
                display: none !important;
            }
        }

        .stock-card {
            background: var(--surface-charcoal);
            border: 1px solid var(--border-dim);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            position: relative;
            overflow: hidden;
        }

        .stock-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--day-2);
            /* Tuesday orange as accent for Flo */
        }

        .stock-card .price {
            font-family: var(--font-headline);
            font-size: 1.5rem;
            font-weight: 900;
            color: white;
        }

        .search-container {
            position: relative;
            width: 100%;
        }

        .search-container i {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            z-index: 10;
        }

        .search-container input {
            padding-left: 3.5rem !important;
            width: 100%;
            border-radius: 4px !important;
        }

        .btn-sync {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-dim);
            color: #94A3B8;
            padding: 0.5rem 1rem;
            font-family: var(--font-headline);
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-sync:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: var(--day-2);
        }
    </style>
</head>

<body class="bg-[#0A0A0A] text-slate-300">

    <header class="flex items-center justify-between px-4 sm:px-6 bg-[#171717] border-b border-white/5">
        <div class="flex items-center gap-3">
            <!-- Hamburger button -->
            <button id="hamburger-trigger"
                class="p-3 -ml-2 text-slate-400 hover:text-orange-400 transition-all active:scale-90"
                title="Ouvrir le menu">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>

            <div id="logo-trigger"
                class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-all active:scale-95 select-none">
                <img src="assets/logo.png" alt="K.O.S.T Logo"
                    class="w-9 h-9 rounded-md object-cover shadow-[0_0_15px_rgba(249,115,22,0.3)] shrink-0 border border-orange-500/30">
                <div class="flex items-baseline gap-2">
                    <h1 class="text-white font-extrabold text-xl tracking-tighter">
                        <span class="text-orange-500">F</span>LO
                    </h1>
                    <span class="text-[10px] font-black bg-blue-600 text-white px-1.5 py-0.5 rounded-sm shadow-[0_0_10px_rgba(37,99,235,0.4)]">V6.7.1</span>
                </div>
            </div>
        </div>

        <!-- Center Clock: Modern HUD Interface -->
        <div id="clock-container">
            <button id="btn-sync-database" class="flex-1 flex items-center justify-center gap-2 bg-orange-600/20 hover:bg-orange-600/40 text-orange-400 border border-orange-600/30 py-4 font-black uppercase tracking-widest transition-all">
                <i data-lucide="download-cloud" class="w-5 h-5"></i>
                <span class="text-xs">Télécharger les données</span>
            </button>
        </div>

        <!-- Sync Progress (Hidden by default) -->
        <div id="sync-progress-container" class="hidden flex-col gap-2 p-4 bg-orange-600/5 border border-orange-600/20 mb-8">
            <div class="flex justify-between items-center text-[10px] font-bold text-orange-500 uppercase tracking-widest">
                <span id="sync-status">Synchronisation...</span>
                <span id="sync-count">0 / 0</span>
            </div>
            <div class="w-full h-1.5 bg-slate-900 rounded-full overflow-hidden border border-white/5">
                <div id="sync-bar" class="h-full bg-orange-500 transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
    </header>

    <main class="flex flex-col h-full overflow-hidden">
        <!-- Search Bar Section -->
        <div class="p-4 sm:p-6 bg-[#171717]/50 border-b border-white/5">
            <div class="max-w-4xl mx-auto flex gap-3">
                <div class="search-container flex-1">
                    <i data-lucide="search" class="w-5 h-5"></i>
                    <input type="text" id="search-input" placeholder="RECHERCHER GENCOD OU RÉFÉRENCE..."
                        autocomplete="off">
                </div>
                <button id="btn-scan"
                    class="scan-btn bg-orange-600 hover:bg-orange-700 text-white p-4 rounded-none transition-colors items-center justify-center hidden">
                    <i data-lucide="camera" class="w-6 h-6"></i>
                </button>
            </div>
        </div>

        <!-- Results Section -->
        <div class="flex-1 overflow-auto bg-[#0A0A0A]">

            <!-- Desktop Table -->
            <div class="results-table">
                <table>
                    <thead>
                        <tr>
                            <th class="w-48">GENCOD</th>
                            <th class="w-32">RÉFÉRENCE</th>
                            <th>LIBELLÉ ARTICLE</th>
                            <th class="w-32 text-right">PRIX</th>
                        </tr>
                    </thead>
                    <tbody id="results-body-desktop">
                        <!-- Les résultats s'afficheront ici après une recherche -->
                    </tbody>
                </table>
            </div>

            <!-- Mobile Grid -->
            <div class="results-grid" id="results-body-mobile">
                <!-- Les résultats s'afficheront ici après une recherche -->
            </div>

        </div>
    </main>

    <!-- Navigation Drawer -->
    <div id="nav-backdrop"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[150] hidden opacity-0 transition-opacity duration-300">
    </div>
    <aside id="nav-drawer"
        class="fixed top-0 left-0 h-full w-72 bg-[#0f172a] border-r border-white/10 z-[200] -translate-x-full transition-transform duration-300 ease-out shadow-2xl">
        <div class="p-6 border-b border-white/5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="assets/logo.png" alt="Logo" class="w-8 h-8 rounded">
                <span class="text-white font-black tracking-tighter">MENU PRINCIPAL</span>
            </div>
            <button id="btn-close-drawer" class="text-slate-500 hover:text-white transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <nav class="p-4 space-y-2">
            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] px-3 mb-4">Modules Disponibles
            </div>

            <a href="index.html"
                class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-white/5 border border-transparent hover:border-white/10 text-slate-400 group transition-all">
                <div class="w-8 h-8 rounded bg-slate-800 flex items-center justify-center group-hover:bg-[#22C55E]/20">
                    <i data-lucide="scan-barcode" class="w-4 h-4 text-slate-400 group-hover:text-[#22C55E]"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-sm font-bold leading-tight group-hover:text-white">Checkage sans ticket</span>
                    <span class="text-[9px] text-slate-500 font-bold uppercase tracking-wider">Inventaire</span>
                </div>
            </a>

            <a href="tictache.html"
                class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-white/5 border border-transparent hover:border-white/10 text-slate-400 group transition-all">
                <div class="w-8 h-8 rounded bg-slate-800 flex items-center justify-center group-hover:bg-yellow-400/20">
                    <i data-lucide="tag" class="w-4 h-4 text-slate-400 group-hover:text-yellow-400"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-sm font-bold leading-tight group-hover:text-white">Ticketage sans ticket</span>
                    <span class="text-[9px] text-slate-500 font-bold uppercase tracking-wider">Impression Mobile</span>
                </div>
            </a>

            <a href="station.html"
                class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-white/5 border border-transparent hover:border-white/10 text-slate-400 group transition-all">
                <div class="w-8 h-8 rounded bg-slate-800 flex items-center justify-center group-hover:bg-cyan-500/20">
                    <i data-lucide="monitor" class="w-4 h-4 text-slate-400 group-hover:text-cyan-400"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-sm font-bold leading-tight group-hover:text-white">Station d'Impression</span>
                    <span class="text-[9px] text-slate-500 font-bold uppercase tracking-wider">PC Bureau</span>
                </div>
            </a>

            <a href="flo.html"
                class="flex items-center gap-4 px-4 py-3 rounded-lg bg-orange-500/10 border border-orange-500/20 text-white group transition-all">
                <div class="w-8 h-8 rounded bg-orange-500/20 flex items-center justify-center">
                    <i data-lucide="trending-up" class="w-4 h-4 text-orange-400"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-sm font-bold leading-tight">Flo</span>
                    <span class="text-[9px] text-orange-400 font-bold uppercase tracking-wider">Module Actif</span>
                </div>
            </a>
            </a>
            
            <a href="explorer.html"
                class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-white/5 border border-transparent hover:border-white/10 text-slate-400 group transition-all">
                <div class="w-8 h-8 rounded bg-slate-800 flex items-center justify-center group-hover:bg-orange-500/20">
                    <i data-lucide="database" class="w-4 h-4 text-slate-400 group-hover:text-orange-400"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-sm font-bold leading-tight group-hover:text-white">DB Explorer</span>
                    <span class="text-[9px] text-slate-500 font-bold uppercase tracking-wider">V6.7.1</span>
                </div>
            </a>
        </nav>

        <div class="absolute bottom-0 left-0 w-full p-6 border-t border-white/5 space-y-4">
            <!-- Global Sync UI in Drawer -->
            <div class="space-y-3">
                <button id="btn-sync-database" class="w-full bg-orange-600/20 hover:bg-orange-600/40 text-orange-400 px-4 py-3 rounded border border-orange-600/30 text-[10px] font-black uppercase flex items-center justify-center gap-2 transition-all">
                    <i data-lucide="download-cloud" class="w-4 h-4"></i>
                    Sync Base Locale
                </button>
                <div id="sync-progress-container" class="hidden space-y-2">
                    <div class="flex justify-between text-[9px] font-bold text-orange-500 uppercase tracking-widest">
                        <span id="sync-status">Synchro...</span>
                        <span id="sync-count">0 / 0</span>
                    </div>
                    <div class="w-full h-1 bg-slate-900 rounded-full overflow-hidden border border-white/5">
                        <div id="sync-bar" class="h-full bg-orange-500 transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
                <div id="sync-info" class="text-[8px] text-slate-500 font-bold uppercase tracking-widest text-center">
                    Statut : <span id="local-db-status" class="text-slate-400">Non chargée</span>
                </div>
            </div>

            <div class="flex items-center gap-3 text-slate-500">
                <i data-lucide="settings" class="w-4 h-4"></i>
                <span class="text-xs font-bold uppercase tracking-widest">Paramètres</span>
            </div>
        </div>
    </aside>

    <div id="toast-container"></div>



    <script src="updater.js" defer></script>
</body>

</html>
