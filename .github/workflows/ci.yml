name: K.O.S.T. CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run ESLint
      run: npx eslint@8 app.js js/ sync.js navigation.js updater.js database.js prices_flo.js

    - name: Compile Tailwind CSS
      run: npm run build
