<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.O.S.T. - Explorateur de Base de Données</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="lucide.js" defer></script>
    <script src="dexie.js" defer></script>
    <script src="database.js" defer></script>
    <script src="navigation.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .db-table-container {
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th {
            background: rgba(255,255,255,0.05);
            text-align: left;
            padding: 12px;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #cbd5e1;
        }
        tr:hover {
            background: rgba(255,255,255,0.02);
        }
        .pagination-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            transition: all 0.2s;
        }
        .pagination-btn:hover:not(:disabled) {
            background: #22c55e;
            border-color: #22c55e;
        }
        .pagination-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-black text-slate-300 min-h-screen flex flex-col">

    <header class="flex items-center justify-between px-4 sm:px-6 bg-slate-900 border-b border-white/5 h-[60px]">
        <div class="flex items-center gap-3">
            <button id="hamburger-trigger" class="p-2 text-slate-400 hover:text-[#22C55E]">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <div class="flex items-center gap-3">
                <img src="assets/logo.png" alt="Logo" class="w-8 h-8 rounded border border-[#22C55E]/30">
                <h1 class="text-white font-black text-lg tracking-tighter uppercase">DB EXPLORER</h1>
            </div>
        </div>
        <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest hidden sm:block">
            Vue temporaire de débogage
        </div>
    </header>

    <main class="flex-1 p-4 sm:p-8 max-w-7xl mx-auto w-full space-y-6">
        
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h2 class="text-2xl font-black text-white uppercase tracking-tight">Catalogue Articles (Local)</h2>
                <p class="text-xs text-slate-500 font-bold uppercase tracking-widest mt-1">
                    Total articles en cache : <span id="total-count" class="text-orange-500">...</span>
                </p>
            </div>
            <div class="flex gap-2">
                <button id="btn-refresh-view" class="bg-blue-600/20 text-blue-400 border border-blue-600/30 px-4 py-2 text-[10px] font-black uppercase rounded hover:bg-blue-600/30 transition-all flex items-center gap-2">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                    Actualiser la vue
                </button>
            </div>
        </div>

        <!-- Table Container -->
        <div class="db-table-container">
            <div class="overflow-x-auto">
                <table>
                    <thead>
                        <tr>
                            <th>GENCOD</th>
                            <th>RÉFÉRENCE</th>
                            <th>COULEUR</th>
                            <th>TAILLE</th>
                            <th>LIBELLÉ / DEPT</th>
                        </tr>
                    </thead>
                    <tbody id="db-tbody">
                        <tr>
                            <td colspan="5" class="text-center py-20 text-slate-500 italic">Chargement des données...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div class="p-4 border-t border-white/5 flex items-center justify-between bg-black/20">
                <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">
                    Page <span id="current-page">1</span> sur <span id="total-pages">...</span>
                </div>
                <div class="flex gap-2">
                    <button id="prev-page" class="pagination-btn" disabled>Précédent</button>
                    <button id="next-page" class="pagination-btn" disabled>Suivant</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Navigation Drawer -->
    <div id="nav-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[150] hidden opacity-0 transition-opacity duration-300"></div>
    <aside id="nav-drawer" class="fixed top-0 left-0 h-full w-72 bg-[#0f172a] border-r border-white/10 z-[200] -translate-x-full transition-transform duration-300 ease-out shadow-2xl">
        <div class="p-6 border-b border-white/5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="assets/logo.png" alt="Logo" class="w-8 h-8 rounded">
                <span class="text-white font-black tracking-tighter uppercase">Menu Principal</span>
            </div>
            <button id="btn-close-drawer" class="text-slate-500 hover:text-white transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <nav class="p-4 space-y-2">
            <a href="index.html" class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-white/5 text-slate-400 transition-all">
                <i data-lucide="scan-barcode" class="w-4 h-4"></i>
                <span class="text-sm font-bold">Checkage</span>
            </a>
            <a href="tictache.html" class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-white/5 text-slate-400 transition-all">
                <i data-lucide="tag" class="w-4 h-4"></i>
                <span class="text-sm font-bold">Ticketage</span>
            </a>
            <a href="station.html" class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-white/5 text-slate-400 transition-all">
                <i data-lucide="monitor" class="w-4 h-4"></i>
                <span class="text-sm font-bold">Station</span>
            </a>
            <a href="flo.html" class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-white/5 text-slate-400 transition-all">
                <i data-lucide="trending-up" class="w-4 h-4"></i>
                <span class="text-sm font-bold">Flo</span>
            </a>
            <a href="explorer.html" class="flex items-center gap-4 px-4 py-3 rounded-lg bg-[#22C55E]/10 border border-[#22C55E]/20 text-white transition-all">
                <i data-lucide="database" class="w-4 h-4 text-[#22C55E]"></i>
                <span class="text-sm font-bold">DB Explorer</span>
            </a>
        </nav>
    </aside>

    <script>
        const PAGE_SIZE = 50;
        let currentPage = 1;

        async function loadTable() {
            const tbody = document.getElementById('db-tbody');
            const totalCountEl = document.getElementById('total-count');
            const currentPageEl = document.getElementById('current-page');
            const totalPagesEl = document.getElementById('total-pages');
            const prevBtn = document.getElementById('prev-page');
            const nextBtn = document.getElementById('next-page');

            try {
                const count = await db.catalogue_articles.count();
                totalCountEl.textContent = count.toLocaleString();
                
                const totalPages = Math.ceil(count / PAGE_SIZE) || 1;
                totalPagesEl.textContent = totalPages;
                currentPageEl.textContent = currentPage;

                // Buttons state
                prevBtn.disabled = currentPage === 1;
                nextBtn.disabled = currentPage >= totalPages;

                // Fetch data
                const items = await db.catalogue_articles
                    .offset((currentPage - 1) * PAGE_SIZE)
                    .limit(PAGE_SIZE)
                    .toArray();

                if (items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-20 text-slate-500 italic">Aucune donnée trouvée. Lancez une synchronisation.</td></tr>';
                    return;
                }

                tbody.innerHTML = items.map(item => `
                    <tr>
                        <td class="font-mono text-[10px] text-[#22C55E]">${item.gencod}</td>
                        <td class="font-bold text-white">${item.ref_article}</td>
                        <td class="text-xs">${item.couleur || "-"}</td>
                        <td class="text-xs">${item.taille || "-"}</td>
                        <td class="text-[10px] text-slate-500 uppercase font-bold">${item.libelle}</td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error("Failed to load table:", err);
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-20 text-red-400">Erreur : ${err.message}</td></tr>`;
            }
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            // Wait for database.js to initialize 'db'
            setTimeout(loadTable, 500);

            document.getElementById('prev-page').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    loadTable();
                }
            });

            document.getElementById('next-page').addEventListener('click', () => {
                currentPage++;
                loadTable();
            });

            document.getElementById('btn-refresh-view').addEventListener('click', () => {
                currentPage = 1;
                loadTable();
            });
        });
    </script>
</body>
</html>
